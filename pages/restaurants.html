<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quán ăn – TROPICAL FOOD</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/home.css" />
  <link rel="stylesheet" href="../css/restaurants.css" />
</head>
<body>

  <!-- ========== THANH ĐIỀU HƯỚNG CHUNG ========== -->
  <nav class="navbar" role="navigation" aria-label="Điều hướng chính">
    <div class="navbar__inner">
      <a href="../index.html" class="navbar__logo" aria-label="TROPICAL FOOD – Trang chủ">
        <img src="../assets/images/logo-on-dark.png" alt="TROPICAL FOOD" class="navbar__logo-img" />
      </a>
      <button class="navbar__toggle" aria-label="Mở menu" aria-expanded="false" aria-controls="main-menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="navbar__menu" id="main-menu" role="list">
        <li><a href="../index.html">Trang chủ</a></li>
        <li><a href="restaurants.html" class="active">Quán ăn</a></li>
        <li><a href="result.html">Hôm nay ăn gì?</a></li>
        <li><a href="tinder.html">Tinder chọn món</a></li>
        <li><a href="account.html">Tài khoản</a></li>
      </ul>
    </div>
  </nav>

  <!-- ========== NỘI DUNG CHÍNH ========== -->
  <main>

    <!-- Thanh tìm kiếm + nút bộ lọc -->
    <section aria-label="Tìm kiếm quán ăn">
      <div class="search-section">
        <form class="search-bar" role="search" id="search-form" style="flex:1; max-width:none;">
          <label for="search-input" class="sr-only">Tìm quán hoặc món ăn</label>
          <input
            type="search"
            id="search-input"
            class="search-bar__input"
            placeholder="Tìm quán, món ăn..."
            autocomplete="off"
            aria-label="Tìm quán hoặc món ăn"
          />
          <button type="submit" class="search-bar__btn btn-primary" aria-label="Tìm kiếm">
            🔍 Tìm
          </button>
        </form>

        <button class="btn-filter-toggle" id="filter-toggle-btn" aria-expanded="false" aria-controls="filter-panel">
          ⚙️ Bộ lọc
        </button>
      </div>

      <!-- Panel bộ lọc -->
      <div class="filter-panel" id="filter-panel" role="region" aria-label="Bộ lọc">

        <!-- Hàng 1: Khu vực + Danh mục -->
        <div class="filter-row">
          <span class="filter-label">Khu vực</span>
          <select id="filter-area" class="filter-select" aria-label="Chọn khu vực">
            <option value="">Tất cả khu vực</option>
            <option value="Quận 1">Quận 1</option>
            <option value="Quận 3">Quận 3</option>
            <option value="Quận 5">Quận 5</option>
            <option value="Quận 7">Quận 7</option>
            <option value="Quận Bình Thạnh">Quận Bình Thạnh</option>
          </select>

          <span class="filter-label" style="margin-left:16px;">Danh mục</span>
          <select id="filter-category" class="filter-select" aria-label="Chọn danh mục">
            <option value="">Tất cả danh mục</option>
            <option value="Món Việt">Món Việt</option>
            <option value="Đồ nướng">Đồ nướng</option>
            <option value="Trà sữa">Trà sữa</option>
          </select>
        </div>

        <!-- Hàng 2: Khoảng giá -->
        <div class="filter-row">
          <span class="filter-label">Khoảng giá</span>
          <div class="filter-btn-group" role="group" aria-label="Chọn khoảng giá">
            <button class="btn-filter active" data-price="" >Tất cả</button>
            <button class="btn-filter" data-price="&lt; 50k">&lt; 50k</button>
            <button class="btn-filter" data-price="50k - 100k">50k – 100k</button>
            <button class="btn-filter" data-price="&gt; 100k">&gt; 100k</button>
          </div>
        </div>

        <!-- Hàng 3: Loại hình -->
        <div class="filter-row">
          <span class="filter-label">Loại hình</span>
          <div class="filter-btn-group" role="group" aria-label="Chọn loại hình">
            <button class="btn-filter active" data-cat="">Tất cả</button>
            <button class="btn-filter" data-cat="Món Việt">Món Việt</button>
            <button class="btn-filter" data-cat="Đồ nướng">Đồ nướng</button>
            <button class="btn-filter" data-cat="Trà sữa">Trà sữa</button>
          </div>
        </div>

        <div class="filter-row">
          <button class="btn-clear-filter" id="clear-filter-btn">✕ Xoá tất cả bộ lọc</button>
        </div>
      </div>
    </section>

    <!-- Đếm kết quả -->
    <p class="result-count" id="result-count" aria-live="polite"></p>

    <!-- Danh sách quán -->
    <div class="restaurant-list" id="restaurant-list" role="list" aria-label="Danh sách quán ăn">
    </div>

    <!-- Không có kết quả -->
    <p class="empty-msg" id="empty-msg" style="display:none;" aria-live="polite">
      😔 Không tìm thấy quán phù hợp. Hãy thử bộ lọc khác nhé!
    </p>

  </main>

  <!-- ========== CHÂN TRANG ========== -->
  <footer>
    <p>© 2026 TROPICAL FOOD – Website Tìm kiếm quán ăn &nbsp;|&nbsp; Được làm bởi nhóm học sinh</p>
  </footer>

  <!-- ========== SCRIPTS ========== -->
  <script src="../data/restaurants.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/restaurants.js"></script>
</body>
</html>
